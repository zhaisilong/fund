[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fund"
version = "0.3.0"
description = "Fund"
readme = "README.md"
authors = [{ name = "Silong Zhai", email = "zhaisilong@outlook.com" }]
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.8",
]
requires-python = ">=3.8"
dependencies = [
    "commitizen",
    "click",
    "loguru",
    "pyyaml",
    "requests",
    "PyExecJS",
    "pandas",
    "plotnine",
    "prophet",
    "matplotlib",
    "numpy<2",
    "requests",
    "rich",
    "jupyter",
    "ipykernel",
    "python-slugify",
    "mplfonts",
    "sphinx",
    "sphinx-autobuild",
    "sphinx_rtd_theme",
    "recommonmark",
    "sphinx-markdown-tables",
    "prompt_toolkit<3.0.39"
]



[project.urls]
Homepage = "https://github.com/zhaisilong/fund"

[project.scripts]
fund = "fund.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fund"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true
